# Cloudflare Pages settings for sailing-home-sarasota-site.
# Plain variables live here (this file wins over the dashboard).
# Secrets are NOT here; set them in the dashboard (Settings > Variables and Secrets):
#   RESEND_API_KEY, TURNSTILE_SECRET_KEY, TEST_TO
name = "sailing-home-sarasota-site"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[vars]
SITE = "sailing-home"
SITE_NAME = "Sailing Home Sarasota website"
MAIL_FROM = "Sailing Home Sarasota website <website@sailinghomesarasota.com>"
LIVE_TO = "sailinghomesarasota@gmail.com"
# "true" since launch (12 Oct 2026): forms go to LIVE_TO. "false" sends them to TEST_TO instead.
FORMS_LIVE = "true"

# Site editor (/admin/, functions/api/admin/[[path]].js). Secret GITHUB_TOKEN is in the dashboard.
GITHUB_REPO = "ZorroNielsen/sailing-home-sarasota-site"
GITHUB_BRANCH = "main"
EDITORS = "siestakeysailing@gmail.com,sailinghomesarasota@gmail.com,websitesbychris.co@gmail.com,adam.kriz.333@gmail.com"
# Cloudflare Access login (covers the whole pages.dev site): team domain + the application's audience tag
# (comma-separated if more than one; Zero Trust → Access → Applications → the app → Application Audience Tag)
ACCESS_TEAM = "keysailing.cloudflareaccess.com"
ACCESS_AUD = "440efa13dc74bdb7a683bd95981e94e5a9d2e44bc60af18ee9e7cf5e0fd27323"
